<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Graduation Cap (Mortarboard) -->
  <g filter="url(#shadow)">
    <!-- Cap Diamond Top -->
    <polygon points="32,11 55,22 32,33 9,22" fill="url(#capGrad)" />

    <!-- Cap Underneath Base (Skullcap) -->
    <path d="M20,28.5 V35 C20,39.5 25.5,42.5 32,42.5 C38.5,42.5 44,39.5 44,35 V28.5 C40,31 36,32 32,32 C28,32 24,31 20,28.5 Z" fill="#F8FAFC" />

    <!-- Golden Tassel -->
    <path d="M32,22 L50,22 V35" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="50" cy="37.5" r="2.5" fill="#F59E0B" />
    <path d="M48.5,39.5 L51.5,39.5 L52.5,44 L47.5,44 Z" fill="#F59E0B" />
  </g>

  <!-- Open Academic Book Base -->
  <g filter="url(#shadow)">
    <!-- Book Pages -->
    <path d="M32,43 C25,39.5 17,40 10,43 V51.5 C17,48.5 25,48 32,52 C39,48 47,48.5 54,51.5 V43 C47,40 39,39.5 32,43 Z" fill="#FFFFFF" />
    <path d="M32,44 V52" stroke="#047857" stroke-width="1.2" stroke-linecap="round" />
    <!-- Golden bookmark ribbon accent -->
    <path d="M32,47 L32,54.5 L34,53 L36,54.5 L36,47 Z" fill="url(#goldGrad)" opacity="0.9" />
  </g>
</svg>
